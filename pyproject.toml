[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prreview"
version = "0.1.0"
description = "Agentic pull-request review: parallel reviewer agents fused by a judge agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
prreview = "prreview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
